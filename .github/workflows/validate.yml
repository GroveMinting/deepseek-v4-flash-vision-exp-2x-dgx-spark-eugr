name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Check shell syntax
        run: |
          bash -n install.sh uninstall.sh run-deepseek-v4-vision.sh
          bash -n mods/deepseek-v4-vision-native-check/run.sh
          bash -n tools/*.sh
      - name: Restore executable permissions
        run: |
          chmod +x install.sh uninstall.sh run-deepseek-v4-vision.sh
          chmod +x tools/*.sh tools/*.py
          chmod +x mods/deepseek-v4-vision-native-check/*.sh
          chmod +x mods/deepseek-v4-vision-native-check/*.py
          chmod +x tests/*.py
      - name: Run package tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tests/test_native_check.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_package.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_wrapper.py
      - name: Validate pinned source preparation
        env:
          DSV4FV_BUILD_DIR: ${{ runner.temp }}/dsv4fv-build
        run: |
          bash tools/deepseek-v4-vision-build.sh --print-pins
          bash tools/deepseek-v4-vision-download.sh --print-pins
          bash tools/deepseek-v4-vision-build.sh --prepare-only
      - name: Validate eugr recipes
        env:
          DSV4FV_BUILD_DIR: ${{ runner.temp }}/dsv4fv-build
        run: |
          eugr="$DSV4FV_BUILD_DIR/spark-vllm-docker"
          bash install.sh "$eugr"
          "$eugr/run-recipe.sh" deepseek-v4-flash-vision-exp-base-fp8 \
            --dry-run --no-ray -n 127.0.0.1,127.0.0.2
          "$eugr/run-recipe.sh" deepseek-v4-flash-vision-exp-dspark-fp8 \
            --dry-run --no-ray -n 127.0.0.1,127.0.0.2
          "$eugr/run-deepseek-v4-vision.sh" --setup --dry-run \
            -n 127.0.0.1,127.0.0.2 -d
